name: 기능 요청
description: 행사·예약·관리 기능 또는 개발 환경 개선 제안
title: "[feat] "
body:
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: 중복 요청 확인
      options:
        - label: 동일한 기능 요청이 이미 등록되어 있는지 기존 이슈를 검색했습니다.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: 기능 영역
      description: 요청과 가장 관련된 영역을 선택합니다. 구체적인 영향은 아래 영향 범위 표에 작성합니다.
      multiple: false
      options:
        - 행사 관리
        - 예약 / 티켓
        - 관리자 화면
        - 개발 환경 / 하네스
        - 기타
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 기능 설명
      description: 현재 불편한 점과 원하는 변경, 사용자가 얻는 효과를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 테스트나 화면 확인으로 판단할 수 있는 조건을 작성합니다.
      placeholder: |
        - [ ] 행사 목록에서 이름으로 검색하면 일치하는 행사만 표시된다.
        - [ ] 기존 행사 목록 조회가 정상 동작한다.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: 제외 범위
      description: 이번 작업에 포함하지 않을 내용을 작성합니다.
      placeholder: 행사 상세 화면 개편
  - type: textarea
    id: dependencies
    attributes:
      label: 선행 작업 / 영향 범위
      description: 선택한 영역에서 구체적으로 영향받는 기능을 작성하고, 해당하지 않는 행은 삭제합니다.
      value: |
        | 항목 | 내용 |
        |---|---|
        | 선행·관련 이슈 | |
        | 구체적으로 영향받는 기능 | |
        | 변경 대상 코드 | |
        | API 호환성 영향 | |
        | 설정·DB 변경 여부 | |
  - type: input
    id: references
    attributes:
      label: 관련 문서 / 코드
      placeholder: 관련 파일 경로 또는 참고 링크
