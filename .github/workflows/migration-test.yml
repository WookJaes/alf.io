name: Local DB migration validation
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    migration:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                  java-version: 17
                  distribution: temurin
            - name: Preserve previous-release JDK path
              run: echo "JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
            - uses: actions/setup-java@v6
              with:
                  java-version: 25
                  distribution: temurin
                  cache: gradle
            - name: Validate previous release DB upgrade with current checkout
              run: bash scripts/validation/migration.sh
