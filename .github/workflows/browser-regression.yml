name: Admin browser regression
on:
    workflow_dispatch:
    pull_request:
        branches: [main]
        paths:
            - 'frontend/admin/**'
            - '.github/workflows/browser-regression.yml'
            - '!**/*.md'
            - '!**/*.rst'
            - '!**/*.adoc'
    push:
        branches: [main]
        paths:
            - 'frontend/admin/**'
            - '.github/workflows/browser-regression.yml'
            - '!**/*.md'
            - '!**/*.rst'
            - '!**/*.adoc'
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    browser-regression:
        name: Browser regression (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        defaults:
            run:
                working-directory: frontend/admin
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '22.22.3'
            - name: Install pnpm
              run: npm install --global pnpm@11.1.2
            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile
            - name: Install managed Chromium
              run: pnpm exec playwright install --with-deps chromium
            - name: Run reconciliation browser regression
              run: pnpm run test:reconciliation
            - name: Run required dropdown browser regression
              run: pnpm run test:required-dropdown
