name: build

on:
    push:
        branches: [main]
        # Preserve release-tag builds required by the existing image jobs.
        tags: ['**']
        paths:
            - 'src/**'
            - 'frontend/**'
            - 'build.gradle*'
            - 'settings.gradle*'
            - 'gradle.properties'
            - 'gradle/**'
            - 'buildSrc/**'
            - 'build-logic/**'
            - 'config/**'
            - 'lib_exclude'
            - 'lombok.config'
            - 'gradlew'
            - 'gradlew.bat'
            - '.codecov.yml'
            - 'codecov.yml'
            - '.github/workflows/build-on-push.yml'
            - '!**/*.md'
            - '!**/*.rst'
            - '!**/*.adoc'
    pull_request:
        branches: [main]
        paths:
            - 'src/**'
            - 'frontend/**'
            - 'build.gradle*'
            - 'settings.gradle*'
            - 'gradle.properties'
            - 'gradle/**'
            - 'buildSrc/**'
            - 'build-logic/**'
            - 'config/**'
            - 'lib_exclude'
            - 'lombok.config'
            - 'gradlew'
            - 'gradlew.bat'
            - '.codecov.yml'
            - 'codecov.yml'
            - '.github/workflows/build-on-push.yml'
            - '!**/*.md'
            - '!**/*.rst'
            - '!**/*.adoc'

jobs:
    detect_changes:
        runs-on: ubuntu-latest
        outputs:
            frontend: ${{ steps.changes.outputs.frontend }}
            backend: ${{ steps.changes.outputs.backend }}
            full: ${{ steps.changes.outputs.full }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Select validation scope
              id: changes
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                    base="${{ github.event.pull_request.base.sha }}"
                  else
                    base="${{ github.event.before }}"
                    if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
                      base="$(git rev-list --max-parents=1 HEAD)"
                    fi
                  fi

                  frontend=false
                  backend=false
                  common=false
                  while IFS= read -r path; do
                    case "$path" in
                      frontend/*)
                        frontend=true
                        ;;
                      build.gradle*|settings.gradle*|gradle.properties|gradle/*|buildSrc/*|build-logic/*|config/*|lib_exclude|lombok.config|gradlew|gradlew.bat|src/main/dist/*|.github/workflows/*|.github/actions/*)
                        common=true
                        ;;
                      src/*)
                        backend=true
                        ;;
                    esac
                  done < <(git diff --name-only "$base" "$GITHUB_SHA")

                  full=false
                  if [[ "$common" == true || ( "$frontend" == true && "$backend" == true ) || "${{ github.event_name }}" == "push" || "${{ github.ref_type }}" == "tag" ]]; then
                    full=true
                  fi

                  echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
                  echo "backend=$backend" >> "$GITHUB_OUTPUT"
                  echo "full=$full" >> "$GITHUB_OUTPUT"
                  echo "Selected validation: frontend=$frontend backend=$backend full=$full"
    build:
        if: ${{ needs.detect_changes.outputs.full == 'true' }}
        needs: detect_changes
        runs-on: ubuntu-latest
        strategy:
            matrix:
                postgresql: ['15', '16', '17']
        steps:
            - uses: actions/checkout@v7
            - name: Set up JDK
              uses: actions/setup-java@v6
              with:
                  java-version: 25
                  distribution: temurin
                  cache: gradle
            - name: Build with Gradle
              run: ./gradlew build distribution jacocoTestReport -Dpgsql.version=${{ matrix.postgresql }}
            - name: Upload coverage to Codecov
              if: ${{ matrix.postgresql == '16'}}
              uses: codecov/codecov-action@v5
              with:
                token: ${{ secrets.CODECOV_TOKEN }}
            - name: Upload test results to Codecov
              if: ${{ !cancelled() && matrix.postgresql == '16'}}
              uses: codecov/test-results-action@v1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
            - name: 'Upload Build'
              if: ${{ github.repository == 'alfio-event/alf.io' && matrix.postgresql == '16'}}
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: build
                  retention-days: 5
    frontend_check:
        if: ${{ needs.detect_changes.outputs.frontend == 'true' && needs.detect_changes.outputs.full != 'true' }}
        needs: detect_changes
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up JDK
              uses: actions/setup-java@v6
              with:
                  java-version: 25
                  distribution: temurin
                  cache: gradle
            - name: Check frontends
              run: ./gradlew frontendCheck
    backend_check:
        if: ${{ needs.detect_changes.outputs.backend == 'true' && needs.detect_changes.outputs.full != 'true' }}
        needs: detect_changes
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up JDK
              uses: actions/setup-java@v6
              with:
                  java-version: 25
                  distribution: temurin
                  cache: gradle
            - name: Check backend
              run: ./gradlew backendCheck
    push_image_dev:
        runs-on: ubuntu-latest
        if: ${{ github.repository == 'alfio-event/alf.io' && github.event_name == 'push' }}
        needs: build
        name: Push dev image
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v8
              with:
                  name: dist
            -   name: Set up QEMU
                uses: docker/setup-qemu-action@v4
            -   name: Configure Docker
                uses: docker/setup-buildx-action@v4
            -   name: Login to Container Registry
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ secrets.CR_USER }}
                    password: ${{ secrets.CR_PAT }}
            -   name: Inject slug/short variables
                uses: rlespinasse/github-slug-action@v5
            -   name: Push Docker image
                uses: docker/build-push-action@v7
                with:
                    context: ./dockerize
                    tags: |
                        ghcr.io/alfio-event/alf.io/dev-${{ env.GITHUB_REF_SLUG }}:latest
                    platforms: linux/amd64,linux/arm64
                    push: true
    push_image_prod:
        runs-on: ubuntu-latest
        if: ${{ github.repository == 'alfio-event/alf.io' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        needs: build
        name: Push PROD image
        steps:
            -   name: Download artifacts
                uses: actions/download-artifact@v8
                with:
                    name: dist
            -   name: Set up QEMU
                uses: docker/setup-qemu-action@v4
            -   name: Configure Docker
                uses: docker/setup-buildx-action@v4
            -   name: Login to Container Registry (GitHub)
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ secrets.CR_USER }}
                    password: ${{ secrets.CR_PAT }}
            -   name: Login to Container Registry (Docker)
                uses: docker/login-action@v4
                with:
                    registry: docker.io
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}
            -   name: Push Docker image
                uses: docker/build-push-action@v7
                with:
                    context: ./dockerize
                    tags: |
                        ghcr.io/alfio-event/alf.io/prod:${{github.ref_name}}
                        alfio/alf.io:${{github.ref_name}}
                        alfio/alf.io:latest
                    platforms: linux/amd64,linux/arm64
                    push: true
