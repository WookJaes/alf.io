name: CI validation checks

on:
    pull_request:
        branches: [main]
        paths:
            - 'scripts/ci/**'
            - 'scripts/validation/*.py'
            - '.github/workflows/**'
            - '!**/*.md'
            - '!**/*.rst'
            - '!**/*.adoc'
    push:
        branches: [main]
        paths:
            - 'scripts/ci/**'
            - 'scripts/validation/*.py'
            - '.github/workflows/**'
            - '!**/*.md'
            - '!**/*.rst'
            - '!**/*.adoc'

permissions:
    contents: read

jobs:
    python:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.13'
            - name: Run result checker regression tests
              run: python3 -B -m unittest discover -s scripts/validation -p 'test_*.py' -v
            - name: Run workflow selection regression tests
              run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v
