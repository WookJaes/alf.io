name: Local E2E validation
on:
    workflow_dispatch:
    pull_request:
        branches: [main]
        paths:
            - 'src/main/**'
            - 'src/test/**'
            - 'frontend/**'
            - 'build.gradle*'
            - 'settings.gradle*'
            - 'gradle.properties'
            - 'gradle/**'
            - 'buildSrc/**'
            - 'build-logic/**'
            - 'config/**'
            - 'lib_exclude'
            - 'lombok.config'
            - 'gradlew'
            - 'gradlew.bat'
            - 'scripts/validation/check-results.py'
            - 'scripts/validation/test_results.py'
            - 'scripts/validation/e2e.sh'
            - '.github/workflows/e2e-test.yml'
            - '!**/*.md'
            - '!**/*.rst'
            - '!**/*.adoc'
    push:
        branches: [main]
        paths:
            - 'src/main/**'
            - 'src/test/**'
            - 'frontend/**'
            - 'build.gradle*'
            - 'settings.gradle*'
            - 'gradle.properties'
            - 'gradle/**'
            - 'buildSrc/**'
            - 'build-logic/**'
            - 'config/**'
            - 'lib_exclude'
            - 'lombok.config'
            - 'gradlew'
            - 'gradlew.bat'
            - 'scripts/validation/check-results.py'
            - 'scripts/validation/test_results.py'
            - 'scripts/validation/e2e.sh'
            - '.github/workflows/e2e-test.yml'
            - '!**/*.md'
            - '!**/*.rst'
            - '!**/*.adoc'
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                  java-version: 25
                  distribution: temurin
                  cache: gradle
            - name: Validate current checkout with headless Chrome
              run: bash scripts/validation/e2e.sh
