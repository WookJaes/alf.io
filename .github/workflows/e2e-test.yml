name: Local E2E validation
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                  java-version: 25
                  distribution: temurin
                  cache: gradle
            - name: Validate current checkout with headless Chrome
              run: bash scripts/validation/e2e.sh
