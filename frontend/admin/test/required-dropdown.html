<!doctype html>
<html lang="en"><head><meta charset="utf-8"></head>
<body>
<alfio-additional-field-edit></alfio-additional-field-edit>
<script type="module">
import '@shoelace-style/shoelace/dist/themes/light.css';
import '../src/purchase-context/additional-field/additional-field-edit.ts';
import '@shoelace-style/shoelace/dist/shoelace.js';
window.openField = async (field) => {
    const editor = document.querySelector('alfio-additional-field-edit');
    await editor.updateComplete;
    await editor.open({field, ordinal: 1, purchaseContext: {
        type: 'subscription', publicIdentifier: 'synthetic', organizationId: 1,
        contentLanguages: [{locale: 'en', language: 'en', displayLanguage: 'English'}]
    }});
};
</script>
</body></html>
